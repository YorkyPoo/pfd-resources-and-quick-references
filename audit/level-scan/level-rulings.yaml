    ruling: "An intermediate can also titrate peep."
    action: "CPAP Titration: Adjust PEEP up to 10 cmH2O to support ventilation and work of breathing"
    note: >-
      Owner ruling 2026-11-20, verbatim: "An intermediate can also titrate peep." The chip is
      now I. PEMS prints the action inside p.239#5 — "Consider CPAP (PEEP: 5 cmH2O) ...
      I/P only: Adjust PEEP to support ventilation and work of breathing, up to 10 cmH2O" —
      a row badged EMT whose own words scope this clause to I/P, so the level is the lowest
      level the clause names (I) and not the row's badge. p.245#4 (CPAP/BiPAP/PEEP procedure)
      badges titration EMT and calls the procedures RED DOT at all levels; the owner has
      ruled which reading governs, so that conflict is settled, not open. The row is
      titration-only, so the chip is the whole authorisation and the OWNER_REQUIRED flag is
      retired.

