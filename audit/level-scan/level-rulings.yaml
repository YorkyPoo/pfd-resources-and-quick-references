  # reason — a level the owner never spoke to must not be attributed to him.)

  # ------------------------------------------------------------- 2026-11-20 PEEP titration
  # Owner ruling, verbatim: "An intermediate can also titrate peep."
  #
  # This settles the p.239#5 / p.245#4 disagreement the row-structure pass left open in
  # favour of the `I/P only` clause: titrating PEEP is an Intermediate-level action. p.245#4
  # badges the CPAP/BiPAP/PEEP procedure EMT and calls CPAP/BiPAP/PEEP RED DOT at all
  # levels, but the row that prints THIS action scopes it to I/P in its own words, and the
  # owner has now decided which reading wins. Neither entry is a source citation: the chip
  # is the owner's decision, the clause is its printed basis, and the row's EMT badge is
  # recorded beside it.
  #
  # `clause_only: true` on both: each site row covers the titration and nothing else, so one
  # chip is the whole authorisation and the ⚑ OWNER_REQUIRED flag retires. A row that still
  # bundled CPAP INITIATION (printed EMT) with titration would keep its flag — see
  # Respiratory Distress r6, which still bundles both and is therefore NOT covered here.
  - file: protocols/respiratory/03_Pulmonary_Edema_Congestion_PROC.md
