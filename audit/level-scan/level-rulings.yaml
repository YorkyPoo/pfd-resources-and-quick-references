# Owner rulings on provider level
#
# A ruling here is the OWNER'S DECISION about the level of an action that no PEMS 2024
# row badges. It is not a source citation: the ledger reports it as `owner_ruled`,
# distinct from `OK` (PEMS-verified), and `level_rule.py --check` refuses to treat it
# as verified. A ruling never turns unbadged prose into a printed badge.
#
# What a ruling may now also record is EVIDENCE that PEMS prints the action at all
# (owner's Pearl ruling 2026-11-17 — "a lot of the pearls are just guidance", so a Pearl
# restating a level creates no new authority, but a Pearl that prints an action proves the
# action is not absent from the source):
#
#   prose_citations:            the unbadged prose that prints the action, named by
#     - page / heading /        page + heading + ordinal into audit/level-scan/
#       ordinal / quote         pems_prose.json and quoting that entry verbatim. --check
#                               re-reads the index and fails if the quote is not a span of
#                               it, so this is checkable exactly like a row citation and
#                               can never be free text.
#   level_from: {page, ordinal} a printed, level-badged row whose badge IS the ruled level
#                               (e.g. the CPAP procedure rows print EMT for the procedure
#                               whose contraindications the page lists). --check fails if
#                               the chip is not that row's printed badge.
#
#   level: FLOOR                the one derived level: "the lowest chip this page itself
#                               carries", computed from the page by page_floor() and
#                               printed in the build log. Never typed by hand.
#
# The owner's scope test applied here (verbatim, 2026-11-17):
#   "Basics and Advanced have only trained to Basic Life Support (BLS) levels.
#    Intermediates and Paramedics can provide Advanced Life Support (ALS). ONLY EMT-I and
#    EMT-P can interpret 12-leads. The pearls section is just reminding that. Patient
#    warming with heat packs is a BLS skill, anyone can do that. If you were to do patient
#    warming with warm saline via IV, well an IV is an ALS skill. EMT and above can do
#    CPAP. No one has to be trained to call poison control. A lot of the pearls are just
#    guidance."
#
# Consumed by scripts/level_rule.py (--write / --check).

