# Row-level bindings for the batch conversion of protocol pages.
#
# Two kinds of entry — machine-checked by scripts/level_rule.py:
#
#   - a BINDING: this site row is authorised by this PEMS 2024 row.
#       pems_page / pems_ordinal   -> resolved in audit/level-scan/pems_table.json
#       evidence                   -> why this site row is that PEMS row
#     The chip becomes the leftmost level that PEMS prints on that row. A binding is
#     a source citation, never a level decision: if the PEMS row does not badge the
#     action, no binding may be written here.
#
#   - an OWNER_REQUIRED declaration: no PEMS 2024 row authorises this row's provider
#     level. The page keeps the level it already published and the chip is flagged.
#     `reason` is required and is published in audit/level-scan/level-rule-ledger.md.
#
# Nothing here is a level the audit invented. Every level comes from a printed PEMS
# badge (binding) or from the page itself (owner_required).
#
# Status: Batch 1 (protocols/cardiac/). Batches 2-5 add their own entries.

bindings:

  # ---------------------------------------------------------------- Asystole / PEA
