  # CPAP p.245, Endotracheal Intubation p.247, Surgical Airway p.269) and in other
  # protocols (Burns p.87-88, Sedation Post Advanced Airway p.55).
  #
  # Two rules decide every row below:
  #   * a row is BOUND only to a row printed on this page's own governing source;
  #   * a row whose action PEMS prints only on a different page keeps the level this page
  #     already published and is declared owner_required — never chipped on another
  #     protocol's authority.
  # Four rows published NO level at all (Respiratory Arrest r11, r14, r15 and Smoke
  # Inhalation r8). There is nothing to keep for those, so each is bound to the row that
  # prints the action and says so; none of them was given an invented level.

