    pems_ordinal: 4
    cross_page: true
    quoted_row_text: "Apply AED / Assess cardiac rhythm every 2 minutes. If AED is advising to shock"
    evidence: >-
      p.235#4 prints "Apply AED / Assess cardiac rhythm every 2 minutes. If AED is advising
      to shock ... defibrillate at maximum joules" at badge EMR. Applying the AED and acting
      on the AED's shock decision is the EMR half of the old bundled row, printed at EMR in
      the source's own words. The parenthetical "(as determined by EMT-I or P)" in the same
      printed sentence scopes the rhythm CLASSIFICATION, which is now row 8a and is flagged
      there as an open decision — it is not used to level this row. Owner instruction
      2026-11-20 (row-structure pass): this action was one of several bundled in a single
      row, so no single level could carry it. Owner ruling R2 (2026-11-20): the AED half
      carries no energy figures; the device selects the energy.

