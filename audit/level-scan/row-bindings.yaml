  # --------------------------------------------------------------------------
  # Owner instruction 2026-11-20 (row-structure pass): bundled rows split into
  # one action per row. The first part keeps the row number, the rest are
  # lettered; each part cites the PEMS row that prints that action, and
  # quoted_row_text names the clause this row publishes so the chip can be
  # checked against the source's own words.
  #
  # Two split parts (8a here and 4a on Cardiac Arrest: Non-Traumatic) are neither
  # CITED nor owner-required: PEMS prints the action inside a row badged for a different
  # clause and scopes it in that row's own words ("as determined by EMT-I or P"). The
  # ladder rule settles those — the chip is the lowest level the words name — so they are
  # recorded as `derived` in level-rulings.yaml (`rule: lowest_printed_level`, quoting the
  # scoping sentence) and carry no binding here. The third part of that shape,
  # Asthma r8a, stays `owner_required` below: its two printed rows disagree and the row is
  # a bundle, so no single lowest level can be derived from them.
  # --------------------------------------------------------------------------

  - file: protocols/respiratory/03_Asthma_COPD_Reactive_Airway_PROC.md
    row: 8a
    status: owner_required
    owner_note: >-
      &#9873; **PEEP titration above 5 cm H₂O — level pending.** PEMS prints titration only inside
      rows badged EMT, and its two printed rows disagree: one scopes it to &quot;I/P only&quot;, the
      other badges it at every level. The level shown follows the I/P wording and is provisional
      until Medical Control confirms it. The same question is open for CPAP titration on the
      Pulmonary Edema protocol.
    reason: >-
      Conflict, recorded: PEEP titration above the initial 5 cm H2O is printed only inside rows
      badged EMT, and the
      two printed rows DISAGREE: p.239#5 ("Consider CPAP (PEEP: 5 cmH2O) ... I/P only: Adjust
      PEEP to support ventilation and work of breathing, up to 10 cmH2O", badge EMT) scopes the
      titration to I/P, while p.245#4 in the CPAP/BiPAP/PEEP procedure ("Consider titrating PEEP
      ... CPAP, BiPAP, and PEEP are RED DOT procedures at all EMS Certification Levels", badge
      EMT) badges it at every level. The chip is I, the level p.239#5's own words give it; no
      printed badge badges titration at I, so it is an open decision, not a citation. The same
      conflict is recorded for Pulmonary Edema row 9, which keeps P. The owner's 2026-11-20
      instruction was the split (initiation / titration as separate rows), not this level.

