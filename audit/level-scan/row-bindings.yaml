    pems_ordinal: 7
    evidence: >-
      p.239#7 'Support respirations with BVM. Use in-line EtCO2... Adjust tidal volume,
      respiratory rate, and/or PEEP' badge EMT. This page splits that one PEMS row into
      r6 (BVM) and r7 (EtCO2-guided ventilation); the page published A here, the source
      prints EMT, so the chip moves A -> EMT.

  - file: protocols/respiratory/03_Respiratory_Distress_PROC.md
    row: 14
    pems_page: 124
    pems_ordinal: 7
    evidence: >-
      This row published no provider level at all. It is the severe asthma/COPD row, and
      PEMS prints magnesium for severe symptoms on p.124#7 ('For severe symptoms, also
      administer: ADULT: Magnesium Sulfate 2 g IV/IO infusion over 15 minutes', badge I).

  - file: protocols/respiratory/03_Upper_Airway_Obstruction_PROC.md
    row: 10
    pems_page: 239
    pems_ordinal: 7
    evidence: >-
      The alignment paired this BVM row with p.239#10 ('If apneic and < 12 years old:
      consider endotracheal intubation', badge P), which is the paediatric intubation
      row. p.239#7 'Support respirations with BVM' is the BVM row, badge EMT, so the
      page's A moves to EMT.

  # ================================================================ CROSS-PAGE CITATIONS + +MC MARKERS
  # Added by the owner rulings of 2026-11-16. Three kinds of entry:
  #   * cross_page: true  — a citation to a PEMS row on another page, with the
  #     cited row's words in `quoted_row_text` (re-read by level_rule.py --check)
  #   * mc_required: true — the page printed this level cell in brackets; render the
  #     level chip plus a distinct +MC marker
  #   * mc_bracket_excluded — a bracketed row whose bracket cannot be carried as +MC
  #     without changing its meaning; the reason says which case it is
  # ================================================================
