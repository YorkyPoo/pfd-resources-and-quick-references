    carried_levels:
      1: EMR
      2: EMR
      3: EMR
      4: EMR
      5: EMT
      6: A
      7: I
      8: I
      9: I
      10: EMR
      11: A

rows:

  - file: protocols/neurologic/05_Stroke_TIA_PROC.md
