    pems_equivalent: PEMS 2024 prints the HF calcium treatment only in the Burns protocol's PEARLS (p.87-88 prose), not as a level-badged row
    rows:
      - row: 6
        carried_from_page: NONE
        note: >-
          <strong>PENDING</strong> — row 6: PEMS 2024 prints the HF calcium treatment only
          in the Burns protocol's PEARLS (p.87-88 prose), not as a level-badged row, so no
          provider level is published for it. <strong>Pending OMD authorization</strong> — no
          provider level applies until the OMD authorizes it. See
          <code>audit/level-scan/pending-protocols.yaml</code> and
          <code>audit/level-scan/level-rule-ledger.md</code>.
        reason: >-
          Agency addition. PEMS 2024 prints 'Treat hypotension with 1 g Calcium Chloride
          IV/IO over 3 minutes' for hydrofluoric acid burns only in the Burns protocol's
          PEARLS (p.87-88 prose), not as a level-badged table row; the only table rows
          printing calcium chloride 1 g IV/IO over 3 minutes are p.91#5 (crush syndrome,
          badge [I]) and p.120#8 (CCB/BB overdose, badge I), whose indications differ. No
          PEMS row authorises this action's provider level, and the page published none.
          Pending OMD authorization.

