# Protocols sourced from OUTSIDE PEMS 2024 — every action row is PENDING OMD Authorization.
#
# A page listed here has no PEMS 2024 protocol to cite: the regional source prints no
# equivalent, so NO row on the page can be verified against PEMS and NONE may claim a PEMS
# citation. The chip is `PENDING`; the ledger status is `pending_omd`; and the level the
# agency's page already published is recorded here as `carried_levels` (the ledger field
# `carried_from_page`). That record is provenance for the reader, never a citation.
#
# Machine-checked by scripts/level_rule.py (--write / --check):
#   * `source` is required and is printed in the page's note and in the ledger;
#   * `pems_page` / `pems_ordinal` / `pems_badge` may not appear (a pending row that names
#     a PEMS row would be exactly the fake citation this file exists to prevent);
#   * `carried_levels` must cover every action row, and the level recorded must equal the
#     level the page published before conversion.
#
# Status: Batch 2-3 (owner ruling 2026-11-15: "Just add pending OMD Authorization on stuff
# like that"). Batches 3-5 add their own entries.
#
# ---------------------------------------------------------------------------
# ROW-LEVEL pending (`rows:` below) — an agency addition on an otherwise PEMS-cited page.
#
# A whole-page entry above says "this protocol is not in PEMS 2024". A row-level entry
# says something narrower: the page IS PEMS-cited, but this one action has no PEMS row
# behind it — the agency added it. It is chipped PENDING for the same reason (nobody has
# authorized the level) and it may not cite a PEMS row either.
#
# Same rules, enforced by scripts/level_rule.py --check:
#   * `reason` is required, and it is what the page note and the ledger quote;
#   * `pems_page` / `pems_ordinal` / `pems_badge` may not appear on a row-level entry —
#     a PENDING row that names a PEMS row is the fake citation this file exists to prevent;
#   * `carried_from_page` is required and must equal the level the page published before
#     conversion (the ledger's `before.leftmost`), so the provenance is checkable, not typed.

protocols:

