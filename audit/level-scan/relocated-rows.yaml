# Rows moved OUT of an action table into that page's "References & Good Practice" block.
#
# Two owner rulings put prose here instead of in the action table:
#   * presentation ruling 2026-11-20 (pilot): unbadged PEARLS / NOTES / CONTRAINDICATIONS
#     prose is not an action row — Pulmonary Edema rows 6-8, Cold Exposure rows 6 and 9.
#   * row-structure instruction 2026-11-20: guidance PEMS prints as instruction to the
#     provider — scene management, recognition, preparation, assessment — is not a numbered
#     action and takes no level — Pediatric Stridor r2, Upper Airway Obstruction r2,
#     Pneumothorax r5, Trauma r6.
#
# A relocated row is still on the page but is no longer a chipped action row, so the ledger
# cannot see it. Each record therefore keeps:
#
#   row / where     which row moved, and where it now reads (a heading in the block)
#   level           the level the page records for the pilot rows; a record WITHOUT
#   guidance: true  `guidance` MUST state it. A guidance record carries NO provider level.
#   status_before   the status the ledger recorded before the move, so the ledger's historical
#                   "flagged before" counts do not silently shrink
#   pems            where the prose is printed in PEMS 2024
#   proves          spans that must appear verbatim on the page. `scripts/level_rule.py
#                   --check` re-reads every record's page and fails if the block is not
#                   printed, so a record can never describe a move that is no longer there.
#
# Nothing here changes a clinical instruction or a level: the words are the page's own, moved.
