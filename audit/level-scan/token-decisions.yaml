    reason: >-
      LEFTOVER TOKEN. The parenthetical only restated the BLS levels in the bolded heading
      "**BLS Airway Adjuncts (EMR/EMT):**", and it contradicted the row's own dots, which
      floor the action at EMT (PEMS p.239#6 prints it at EMT). Removed; the heading, the
