  - file: protocols/respiratory/03_Upper_Airway_Obstruction_PROC.md
    row: 11
    hit: "(Intermediate/Paramedic)"
    replaced_with: "**Unable to Ventilate - Laryngoscopy and Forceps Removal:**"
    reason: >-
      LEFTOVER TOKEN. The parenthetical restated the row's level in the bolded heading
      "**Unable to Ventilate - Laryngoscopy and Forceps Removal (Intermediate/Paramedic):**";
      the chip is I (p.239#8 prints laryngoscopy/forceps at I). Removed; the heading, the
