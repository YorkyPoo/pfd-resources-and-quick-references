# Explicit decisions for provider-level words that survive INSIDE action text.
#
# scripts/level_rule.py --check sweeps every action row for level words with patterns
# that are independent of the conversion's own stripper (TEXT_TOKEN only sees the
# "LEVEL:" prefixes it removes, so it cannot see a parenthetical). Any level word found
# in an action text must be named here, or the check fails. A `kept` entry whose text is
# no longer on the page also fails, so this file cannot silently rot into a rubber stamp.
#
# Two outcomes, and only two:
#
#   kept     the level word is a CLINICAL QUALIFIER: it changes what the action means and
#            is intrinsic to the sentence. A later pass must not strip it.
#   removed  the level word only restated the chip. The page has been edited; the record
#            stays here so the removal is auditable and nobody "restores" it.
#
# Sweep evidence: audit/level-scan/token_sweep.py (same four patterns, run independently
# of the checker). At the time of writing it finds 14 raw matches collapsing to 5
# distinct expressions on 3 Batch-1 cardiac pages, and 0 on every Batch-2, neurologic and
# Aortic page.

kept:

  - file: protocols/cardiac/04_Chest_Pain_ACS_PROC.md
    row: 5
    hits:
      - Intermediate
      - Paramedic
    reason: >-
      CLINICAL QUALIFIER. "Intermediate and Paramedic providers may interpret as STEMI
      if: ..." names the providers whose interpretation counts, and states the criteria
      they apply. Removing the words would leave "may interpret as STEMI", which grants
      the interpretation to anyone. Deliberate, kept.
      NOTE for the owner: this row's chip is P (the level the page published; the row is
      OWNER_REQUIRED) while the sentence also names Intermediate. The chip/text
      difference is part of the existing OWNER_REQUIRED flag on this row, not a level
      this sweep may settle.

  - file: protocols/respiratory/03_Pediatric_Stridor_PROC.md
    row: 6
    hits:
      - "(titratable by I/P providers)"
    reason: >-
      CLINICAL QUALIFIER. The parenthetical scopes PEEP titration above the initial 5 cmH2O
      to I/P, i.e. it says what the EMT-floor CPAP chip does NOT include. The chip is the
      floor PEMS prints for CPAP (p.123#3, EMT); stripping the parenthetical would widen who
      may titrate. Deliberate, kept.

  - file: protocols/respiratory/03_Pediatric_Stridor_PROC.md
    row: 11
    hits:
      - Paramedic
    reason: >-
      CLINICAL QUALIFIER. "Intubation of children <12 requires Paramedic skill" is the
      red-dot caveat on an advanced-airway preparation row. It is a safety condition on the
      action, not a restatement of the chip (the chip is P because the page published P and
      no PEMS 2024 row authorises the row). Deliberate, kept.

  - file: protocols/respiratory/03_Respiratory_Arrest_PROC.md
    row: 9
    hits:
      - Paramedic
    reason: >-
      CLINICAL QUALIFIER. "RED DOT SKILL: Intubation of children <12 years is a Paramedic
      red dot skill only" is the source's own safety caveat on paediatric intubation (PEMS
      p.239#10 prints the row with the same red-dot note). The chip is P; the sentence adds
      the red-dot condition and must not be stripped. Deliberate, kept.

  - file: protocols/respiratory/03_Smoke_Inhalation_PROC.md
    row: 6
    hits:
      - Paramedic
    reason: >-
      CLINICAL QUALIFIER. "Intubation of children under 12 years old is a Paramedic red dot
      skill only" scopes the paediatric half of a row whose chip is I (the adult ETI row
      p.239#9). Removing it would present paediatric intubation as an I-level action.
      Deliberate, kept.

  - file: protocols/respiratory/03_Upper_Airway_Obstruction_PROC.md
    row: 12
    hits:
      - Paramedic
    reason: >-
      CLINICAL QUALIFIER. "Intubation of children <12 years is a Paramedic red dot skill
      only" scopes the paediatric half of a merged adult/pediatric ETI row. The chip is I
      (the lowest level PEMS prints for the action, p.239#9); the caveat is what keeps the
      paediatric P requirement visible. Deliberate, kept.

  - file: protocols/administrative/01_Trauma_Field_Triage_PROC.md
    row: 3
    hits:
      - "(Level I or II)"
    reason: >-
      NOT a provider level. "Level I or II" is the trauma-center designation the PEMS
      policy prints ("shall be transported to the closest appropriate trauma center"; the
      procedure section says "should be transported to a Level I or Level II trauma
      center"). It names the destination facility's designation, not which provider may
      perform the action, and must not be stripped.

removed:

  - file: protocols/cardiac/04_Asystole_and_Pulseless_Electrical_Activity_PROC.md
    row: 8
    hit: "(as determined by EMT-I or P)"
    replaced_with: "the chip on row 8a (I)"
    reason: >-
      MOVED INTO A CHIP, not dropped. Owner instruction 2026-11-20 split this bundled row:
      row 8 is now "Apply AED / Assess cardiac rhythm every 2 minutes" (EMR, p.235#4) and
      row 8a is "Determine rhythm..." at I. The parenthetical named WHO may make the rhythm
      determination, and that scope is now the level of the row that performs it, so leaving
      the words on either row would duplicate the level the convention forbids in action
      text. The judgement recorded here on 2026-11-15 — stripping it would widen who may
      determine the rhythm — is preserved: the determination is not at EMT any more, it is a
      row of its own at I (level-rulings.yaml, owner_ruled 2026-11-20).

  - file: protocols/cardiac/04_V_Fib_Pulseless_V_Tach_PROC.md
    row: 5
    hit: "(AED for EMR/EMT, Manual for I/P)"
    replaced_with: "two rows, 5 (EMR, AED) and 5a (I, manual)"
    reason: >-
      MOVED INTO A CHIP, not dropped. Owner instruction 2026-11-20 split the defibrillation
      row by device, which is exactly what the parenthetical described: row 5 is the AED
      defibrillation at EMR (p.235#4) and row 5a is the manual defibrillation at I (p.63#7).
      Neither level is stated twice now, which is what made the old row impossible to chip.

  - file: protocols/cardiac/04_Chest_Pain_ACS_PROC.md
    row: 4
    hit: "(EMT)"
    replaced_with: "**12-Lead ECG Acquisition:**"
    reason: >-
      LEFTOVER TOKEN. The parenthetical only restated the row's own chip (EMT) in the
      bolded heading "**12-Lead ECG Acquisition (EMT):**". Removed; the heading, the
      chip and every bullet are unchanged.

  - file: protocols/respiratory/03_Respiratory_Arrest_PROC.md
    row: 4
    hit: "(EMR/EMT)"
    replaced_with: "**BLS Airway Adjuncts:**"
    reason: >-
      LEFTOVER TOKEN. The parenthetical only restated the BLS levels in the bolded heading
      "**BLS Airway Adjuncts (EMR/EMT):**", and it contradicted the row's own dots, which
      floor the action at EMT (PEMS p.239#6 prints it at EMT). Removed; the heading, the
      chip and every bullet are otherwise unchanged.

  - file: protocols/respiratory/03_Upper_Airway_Obstruction_PROC.md
    row: 10
    hit: "(EMT and above)"
    replaced_with: "**Apneic Patient - BVM Ventilation:**"
    reason: >-
      LEFTOVER TOKEN. The parenthetical restated the row's level in the bolded heading
      "**Apneic Patient - BVM Ventilation (EMT and above):**". The chip is EMT (p.239#7
      prints BVM at EMT), so the words added nothing the chip does not say. Removed; the
      heading, the chip and every bullet are otherwise unchanged.

  - file: protocols/respiratory/03_Upper_Airway_Obstruction_PROC.md
    row: 11
    hit: "(Intermediate/Paramedic)"
    replaced_with: "**Unable to Ventilate - Laryngoscopy and Forceps Removal:**"
    reason: >-
      LEFTOVER TOKEN. The parenthetical restated the row's level in the bolded heading
      "**Unable to Ventilate - Laryngoscopy and Forceps Removal (Intermediate/Paramedic):**";
      the chip is I (p.239#8 prints laryngoscopy/forceps at I). Removed; the heading, the
      chip and every bullet are otherwise unchanged.

  - file: protocols/cardiac/04_V_Fib_Pulseless_V_Tach_PROC.md
    row: 8
    hit: "[MC]"
    replaced_with: "**5 mg/kg** (Ped max 150mg, Medical Control authorisation required)"
    reason: >-
      INLINE AUTHORISATION TOKEN, not a level. PEMS p.64#10 prints 'PEDIATRIC: [Contact Medical
      Control] Amiodarone (Cordarone) 5 mg/kg IV/IO slow push. Maximum dose 150 mg.' The bracket
      scopes the PEDIATRIC dose only, so it cannot be lifted to the row chip — a `+MC` marker
      would wrongly gate the adult dose, which needs no Medical Control contact. Operator ruling
      2026-11-20 (R4: no inline authorisation in action text): the bracket is spelled out in
      words instead, and the adult/pediatric distinction is kept.

  - file: protocols/cardiac/04_V_Fib_Pulseless_V_Tach_PROC.md
    row: 9
    hit: "[MC]"
    replaced_with: "**40 mg/kg** (Ped max 2g, Medical Control authorisation required)"
    reason: >-
      INLINE AUTHORISATION TOKEN, not a level. PEMS p.64#11 prints 'PEDIATRIC: [Contact Medical
      Control] Magnesium Sulfate 40 mg/kg IV/IO slow push. Maximum dose 2 g.' Paediatric dose
      only, so it cannot be the row chip (the adult 2 g needs no Medical Control contact).
      Spelled out in words under operator ruling 2026-11-20 (R4).

