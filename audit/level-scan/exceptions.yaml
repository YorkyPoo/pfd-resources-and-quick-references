# Deliberate deviations from the PEMS regional source.
#
# Every entry carries a `reason`. An exception without a reason is a hard
# error, by design: this file records human decisions; rows the matcher could
# not pair are reported as UNMATCHED and are never edited.
#
# Page-level keys:
#   file:        path relative to docs/ (e.g. protocols/cardiac/Foo.md)
#   reason:      one line, mandatory
#   kind:        administrative | explanatory   (page is not level-gated at all)
#   pems_pages:  [n, ...]   force the PEMS source page(s); continuation pages of
#                           a forced page are included automatically
#   rows:        {"<row number or divider:label>": {kind|cells|pems_page/pems_row, reason}}
#
# Row kinds: divider | local | skip

pages:
